<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدرسة الإمام أبو حنيفة الابتدائية بالمهدج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#0F5132;--g2:#198754;--gold:#D4A017;--bg:#f4f6f5;--tx:#1d2b24;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--g1);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px}
.logo{font-weight:800;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{background:var(--gold);color:var(--g1);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-size:15px}
nav a:hover,nav a.on{background:var(--g2)}
#menu{display:none;margin-inline-start:auto;background:none;border:1px solid #fff8;color:#fff;border-radius:8px;font-size:22px;padding:2px 10px;cursor:pointer}
@media(max-width:820px){#menu{display:block}nav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:240px;background:var(--g1);flex-direction:column;padding:70px 12px;transform:translateX(100%);transition:.25s;margin:0}
html[dir=rtl] nav{transform:translateX(100%)}nav.open{transform:none!important}}
main{max-width:1100px;margin:0 auto;padding:20px 16px;min-height:70vh}
h1,h2{color:var(--g1);margin:.3em 0}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:18px;padding:36px 22px;text-align:center}
.hero h1{color:#fff;font-size:clamp(1.6rem,4vw,2.4rem)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:20px}
.stat{background:#ffffff22;border-radius:12px;padding:12px}.stat b{display:block;font-size:2rem;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:14px 0}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 6px #0001;display:flex;flex-direction:column;gap:6px;border:1px solid #0000}
.card h3{margin:0;color:var(--g1)}
a.card{text-decoration:none}a.card:hover,.card.click:hover{border-color:var(--gold)}
.tag{display:inline-block;background:#e6f2ec;color:var(--g1);border-radius:20px;padding:0 10px;font-size:13px;margin-inline-end:4px}
.tag.gold{background:#fbf1d3;color:#7a5a00}
.btn{background:var(--g1);color:#fff;border:0;border-radius:10px;padding:8px 18px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--g2)}.btn.alt{background:#fff;color:var(--g1);border:1px solid var(--g1)}.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #9ab;border-radius:10px;background:#fff;min-width:0}
.marq{background:#fbf1d3;border-radius:10px;overflow:hidden;white-space:nowrap;margin:16px 0;padding:6px 0}
.marq span{display:inline-block;padding-inline-start:100%;animation:m 28s linear infinite}
.marq:hover span{animation-play-state:paused}
@keyframes m{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.marq span{animation:none;padding:0}}
.prog{height:10px;background:#dde;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g2)}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px;border:2px solid #cdd;border-radius:10px;background:#fff;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--g2);background:#e6f2ec}.opt.ok{border-color:#198754;background:#d1f0dd}.opt.bad{border-color:#c0392b;background:#f8d7d3}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.empty{text-align:center;padding:30px;color:#667}
.err{color:#b02a1a;font-size:14px}.okmsg{background:#d1f0dd;padding:10px;border-radius:10px}
form label{display:block;margin:8px 0}form input,form textarea{width:100%}
footer{background:var(--g1);color:#fff;padding:20px 16px;text-align:center}
footer a{margin:0 8px;color:var(--gold)}
</style>
</head>
<body>
<header>
 <a class="logo" href="#/" aria-label="الرئيسية"><i>🕌</i><span id="hn"></span></a>
 <button id="menu" aria-label="فتح القائمة" aria-expanded="false">☰</button>
 <nav id="nav" aria-label="التنقل الرئيسي"></nav>
</header>
<main id="app" tabindex="-1"></main>
<footer><b id="fn"></b><p id="fl"></p><small>© جميع الحقوق محفوظة</small></footer>
<div id="mod"></div>
<script>
/* ===== الإعدادات والبيانات (يمكن فصلها لاحقًا إلى ملفات/API) ===== */
const SCHOOL={name:"مدرسة الإمام أبو حنيفة الابتدائية",place:"المهدج - منطقة جازان",students:177,teachers:21};
const ROUTES=[["","الرئيسية"],["nafes","اختبارات نافس"],["achievements","إنجازات المدرسة"],["platforms","منصات تعليمية"],["about","عن المدرسة"],["contact","تواصل معنا"]];
const NEWS=["بدء التسجيل في الأنشطة اللاصفية للفصل الدراسي الثاني","تهنئة لطلابنا المتميزين في الاختبارات التجريبية","اجتماع مجلس أولياء الأمور قريبًا — تابعوا الإعلانات"];
const mk=(s,g,n,d,l,qs)=>({subject:s,grade:g,n:qs.length,min:d,level:l,qs});
const EXAMS=[
 mk("رياضيات","الرابع الابتدائي",0,6,"سهل",[["ناتج 12 × 5 =",["50","60","65","72"],1],["أي الكسور يساوي النصف؟",["٢/٣","٢/٤","١/٣","٣/٥"],1],["محيط مربع طول ضلعه 4 سم =",["8 سم","12 سم","16 سم","20 سم"],2]]),
 mk("رياضيات","السادس الابتدائي",0,8,"صعب",[["ناتج 3/4 + 1/4 =",["١","٢/٤","٤/٨","٣/٨"],0],["٢٥٪ من 80 =",["10","20","25","40"],1],["مساحة مستطيل 6 × 5 =",["11","22","30","60"],2]]),
 mk("علوم","الخامس الابتدائي",0,6,"متوسط",[["أي الكواكب أقرب إلى الشمس؟",["الأرض","عطارد","المريخ","زحل"],1],["العملية التي يصنع بها النبات غذاءه:",["التبخر","التنفس","البناء الضوئي","الهضم"],2],["الماء يتجمد عند:",["0°م","50°م","100°م","-50°م"],0]]),
 mk("لغة عربية","الرابع الابتدائي",0,5,"سهل",[["جمع كلمة «كتاب»:",["كتب","كتابون","كتّاب","أكتاب"],0],["الفعل في جملة «يلعب الولد» هو:",["الولد","يلعب","جملة","لا يوجد"],1],["ضد كلمة «كبير»:",["طويل","صغير","واسع","قوي"],1]]),
 mk("لغة عربية","السادس الابتدائي",0,7,"متوسط",[["إعراب «محمدٌ» في «جاء محمدٌ»:",["فاعل مرفوع","مفعول به","مبتدأ","خبر"],0],["المثنى من «معلم»:",["معلمان","معلمون","معلمات","معلمين"],0],["علامة نصب جمع المذكر السالم:",["الضمة","الياء","الألف","الفتحة"],1]]),
 mk("لغة إنجليزية","الخامس الابتدائي",0,5,"سهل",[["ما معنى «apple»؟",["تفاحة","موزة","برتقالة","عنب"],0],["ما معنى «school»؟",["بيت","مدرسة","سوق","حديقة"],1],["ترجمة «ثلاثة»:",["one","two","three","four"],2]])
].map((e,i)=>({...e,id:i+1}));
const ACH=[
 ["تكريم المدرسة في مسابقة القراءة","فازت المدرسة بمراكز متقدمة في مسابقة القراءة على مستوى الإدارة.","2026-03-12","ثقافي","إدارة التعليم","📚"],
 ["بطولة كرة القدم المدرسية","حصل فريق المدرسة على المركز الثاني في بطولة المدارس الابتدائية.","2026-02-02","رياضي","إدارة التعليم","⚽"],
 ["التميز في الاختبارات الوطنية","حققت المدرسة نتائج متقدمة في اختبارات القياس الوطنية.","2025-12-10","أكاديمي","هيئة تقويم التعليم","🏅"],
 ["مشروع الروبوت الصغير","شارك طلاب المدرسة بمشروع تقني في معرض الابتكار المدرسي.","2025-05-20","تقني","الإدارة العامة للتعليم","🤖"],
 ["مدرسة صديقة للبيئة","تنفيذ مبادرة التشجير وتدوير النفايات داخل المدرسة.","2025-04-08","ثقافي","وزارة التعليم","🌳"],
 ["المركز الأول في الرياضيات","تكريم طلاب فازوا في أولمبياد الرياضيات المدرسي.","2024-11-15","أكاديمي","إدارة التعليم","➗"]
].map((a,i)=>({id:i,title:a[0],desc:a[1],date:a[2],cat:a[3],by:a[4],icon:a[5],year:a[2].slice(0,4),students:[12,14,30,6,40,5][i]}));
const PLAT=[
 ["منصة مدرستي","دروس ومحتوى تعليمي وفصول افتراضية.","طلاب","https://schools.madrasati.sa","🎓"],
 ["نظام نور","النتائج والغياب وبيانات الطلاب.","أولياء أمور","https://noor.moe.gov.sa","📋"],
 ["منصة إجادة","منصة لتطوير مهارات المعلمين والطلاب.","معلمين","https://www.moe.gov.sa","⭐"],
 ["بوابة المستقبل","خدمات المعلمين والموظفين التعليمية.","معلمين","https://www.moe.gov.sa","🚪"],
 ["منصة روضتي","منصة التعليم في مرحلة الطفولة المبكرة.","أولياء أمور","https://www.moe.gov.sa","🧸"],
 ["المركز الوطني للقياس","اختبارات وقياس القدرات.","طلاب","https://www.qiyas.sa","📝"],
 ["منصة مسار","المسار الوظيفي للمعلمين.","معلمين","https://www.moe.gov.sa","🧭"],
 ["هيئة تقويم التعليم","الاختبارات الوطنية (نافس) ونتائجها.","أولياء أمور","https://www.etec.gov.sa","📊"]
];
/* ===== أدوات ===== */
const $=s=>document.querySelector(s),mem={};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleDateString("ar-SA",{year:"numeric",month:"long",day:"numeric"});
const num=n=>n.toLocaleString("ar-SA");
let timer=null;
function closeMod(){$("#mod").innerHTML=""}
function modal(html){$("#mod").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div>${html}<p><button class="btn alt" id="cl">إغلاق</button></p></div></div>`;$("#cl").onclick=closeMod;$("#cl").focus();$(".modal").onclick=e=>{if(e.target.classList.contains("modal"))closeMod()}}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMod()});
/* ===== الصفحات ===== */
const pages={
home(){
 const last=[...ACH].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
 return `<section class="hero"><div style="font-size:48px">🕌</div><h1>${SCHOOL.name}</h1><p>${SCHOOL.place} — نرحب بكم في بوابتنا التعليمية</p>
 <div class="stats">${[["students","الطلاب",SCHOOL.students],["t","المعلمون",SCHOOL.teachers],["a","الإنجازات",ACH.length],["e","الاختبارات",EXAMS.length]].map(s=>`<div class="stat"><b data-n="${s[2]}">0</b>${s[1]}</div>`).join("")}</div></section>
 <div class="marq" role="marquee" aria-label="أخبار المدرسة"><span>📢 ${NEWS.join(" &nbsp;•&nbsp; 📢 ")}</span></div>
 <h2>وصول سريع</h2><div class="grid">${[["nafes","📝","اختبارات نافس"],["achievements","🏆","إنجازات المدرسة"],["platforms","🎓","منصة مدرستي"],["platforms","📋","نظام نور"]].map(c=>`<a class="card" href="#/${c[0]}"><div style="font-size:30px">${c[1]}</div><h3>${c[2]}</h3></a>`).join("")}</div>
 <h2>آخر الإنجازات</h2><div class="grid">${last.map(a=>`<div class="card"><div style="font-size:30px">${a.icon}</div><h3>${a.title}</h3><small>${fmt(a.date)}</small></div>`).join("")}</div>
 <h2>اختبارات نافس المقترحة</h2><div class="grid">${EXAMS.slice(0,3).map(e=>`<a class="card" href="#/nafes"><h3>${e.subject}</h3><span>${e.grade}</span><span class="tag">${e.level}</span></a>`).join("")}</div>`},
nafes(){
 const h=ls.get("h",[]);
 const subs=[...new Set(EXAMS.map(e=>e.subject))],grs=[...new Set(EXAMS.map(e=>e.grade))],lv=["سهل","متوسط","صعب"];
 const opt=a=>a.map(x=>`<option>${x}</option>`).join("");
 return `<h1>اختبارات نافس التجريبية</h1>
 <div class="bar"><input id="q" type="search" placeholder="ابحث عن اختبار…" aria-label="بحث"><select id="s" aria-label="المادة"><option value="">كل المواد</option>${opt(subs)}</select><select id="g" aria-label="الصف"><option value="">كل الصفوف</option>${opt(grs)}</select><select id="l" aria-label="الصعوبة"><option value="">كل المستويات</option>${opt(lv)}</select></div>
 <div class="grid" id="ex"></div>
 <h2>سجل المحاولات</h2>${h.length?`<div class="grid">${h.slice(0,8).map(r=>`<div class="card"><b>${esc(r.title)}</b><span>النتيجة: ${num(r.pct)}٪</span><small>${fmt(r.date)}</small></div>`).join("")}</div><button class="btn alt" id="clr">مسح السجل</button>`:`<p class="empty">لا توجد محاولات سابقة بعد.</p>`}`},
achievements(){
 const yrs=[...new Set(ACH.map(a=>a.year))].sort().reverse(),cats=[...new Set(ACH.map(a=>a.cat))],cy=String(new Date().getFullYear());
 return `<h1>إنجازات المدرسة</h1><div class="grid"><div class="card"><b style="font-size:2rem">${num(ACH.length)}</b>إجمالي الإنجازات</div><div class="card"><b style="font-size:2rem">${num(ACH.filter(a=>a.year===cy).length)}</b>إنجازات هذا العام</div><div class="card"><b style="font-size:2rem">${num(ACH.reduce((s,a)=>s+a.students,0))}</b>طالب مكرَّم</div></div>
 <div class="bar"><select id="c" aria-label="الفئة"><option value="">كل الفئات</option>${cats.map(x=>`<option>${x}</option>`).join("")}</select><select id="y" aria-label="السنة"><option value="">كل السنوات</option>${yrs.map(x=>`<option>${x}</option>`).join("")}</select><select id="o" aria-label="الترتيب"><option value="d">الأحدث أولًا</option><option value="a">الأقدم أولًا</option></select></div><div class="grid" id="al"></div>`},
platforms(){
 return `<h1>صفحات تهمك</h1><div class="bar"><select id="f" aria-label="الفئة المستهدفة"><option value="">الكل</option><option>طلاب</option><option>معلمين</option><option>أولياء أمور</option></select></div><div class="grid" id="pl"></div>`},
about(){
 return `<h1>عن المدرسة</h1><div class="grid"><div class="card"><h3>نبذة</h3>${SCHOOL.name} في ${SCHOOL.place}، تضم ${num(SCHOOL.students)} طالبًا و${num(SCHOOL.teachers)} معلمًا، وتسعى لبيئة تعليمية محفزة.</div><div class="card"><h3>الرؤية</h3>مدرسة رائدة تُخرِّج جيلًا متعلمًا ومبدعًا.</div><div class="card"><h3>الرسالة</h3>تقديم تعليم متميز بشراكة فاعلة مع الأسرة والمجتمع.</div><div class="card"><h3>القيم</h3>الإتقان • الأمانة • التعاون • الاحترام</div></div>
 <h2>الهيكل التنظيمي</h2><div class="grid"><div class="card">مدير المدرسة</div><div class="card">الوكيل</div><div class="card">الموجه الطلابي</div><div class="card">رائد النشاط</div><div class="card">المعلمون</div></div>`},
contact(){
 return `<h1>تواصل معنا</h1><div class="grid"><form class="card" id="cf" novalidate><label>الاسم<input name="n" autocomplete="name"><span class="err"></span></label><label>البريد الإلكتروني<input name="e" type="email" dir="ltr"><span class="err"></span></label><label>الموضوع<input name="s"><span class="err"></span></label><label>الرسالة<textarea name="m" rows="4"></textarea><span class="err"></span></label><button class="btn">إرسال</button><div id="r" role="status"></div></form>
 <div class="card"><h3>العنوان</h3>${SCHOOL.place}<h3>أوقات الدوام</h3>الأحد – الخميس: 6:45 ص – 1:30 م</div></div>`}
};
/* ===== ربط الأحداث ===== */
const bind={
home(){document.querySelectorAll("[data-n]").forEach(el=>{const t=+el.dataset.n,s=performance.now();(function f(n){const p=Math.min((n-s)/900,1);el.textContent=num(Math.round(t*p));if(p<1)requestAnimationFrame(f)})(s)})},
nafes(){
 const draw=()=>{const q=$("#q").value.trim(),s=$("#s").value,g=$("#g").value,l=$("#l").value;
  const r=EXAMS.filter(e=>(!s||e.subject===s)&&(!g||e.grade===g)&&(!l||e.level===l)&&(!q||(e.subject+e.grade).includes(q)));
  $("#ex").innerHTML=r.length?r.map(e=>`<div class="card"><h3>${e.subject}</h3><span>${e.grade}</span><div><span class="tag">${num(e.n)} أسئلة</span><span class="tag">${num(e.min)} دقائق</span><span class="tag gold">${e.level}</span></div><button class="btn" data-id="${e.id}">ابدأ الاختبار</button></div>`).join(""):`<p class="empty">لا توجد اختبارات مطابقة.</p>`;
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>start(+b.dataset.id))};
 ["#q","#s","#g","#l"].forEach(i=>$(i).oninput=draw);draw();
 const c=$("#clr");if(c)c.onclick=()=>{ls.del("h");route()};
 const sv=ls.get("q",null);if(sv&&sv.end>Date.now()&&EXAMS.find(e=>e.id===sv.id))quiz(sv);else if(sv)ls.del("q")},
achievements(){
 const draw=()=>{const c=$("#c").value,y=$("#y").value,o=$("#o").value;
  const r=ACH.filter(a=>(!c||a.cat===c)&&(!y||a.year===y)).sort((a,b)=>o==="d"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  $("#al").innerHTML=r.length?r.map(a=>`<div class="card click" tabindex="0" role="button" data-a="${a.id}"><div style="font-size:30px">${a.icon}</div><h3>${a.title}</h3><div><span class="tag">${a.cat}</span><small>${fmt(a.date)}</small></div></div>`).join(""):`<p class="empty">لا توجد إنجازات في هذا التصنيف أو السنة.</p>`;
  document.querySelectorAll("[data-a]").forEach(el=>{const f=()=>{const a=ACH[+el.dataset.a];modal(`<div style="font-size:40px">${a.icon}</div><h2>${a.title}</h2><p>${a.desc}</p><p><span class="tag">${a.cat}</span><span class="tag gold">${a.by}</span></p><small>${fmt(a.date)}</small>`)};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}})};
 ["#c","#y","#o"].forEach(i=>$(i).oninput=draw);draw()},
platforms(){const draw=()=>{const f=$("#f").value;$("#pl").innerHTML=PLAT.filter(p=>!f||p[2]===f).map(p=>`<div class="card"><div style="font-size:30px">${p[4]}</div><h3>${p[0]}</h3><p>${p[1]}</p><span class="tag">${p[2]}</span><a class="btn" href="${p[3]}" target="_blank" rel="noopener noreferrer">زيارة المنصة</a></div>`).join("")};$("#f").oninput=draw;draw()},
contact(){$("#cf").onsubmit=e=>{e.preventDefault();const f=e.target,v=n=>f[n].value.trim(),er=[];
 const chk=(n,ok,m)=>{f[n].parentElement.querySelector(".err").textContent=ok?"":m;if(!ok)er.push(n)};
 chk("n",v("n").length>=3,"أدخل اسمًا من 3 أحرف على الأقل");chk("e",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("e")),"بريد إلكتروني غير صالح");chk("s",v("s").length>=3,"أدخل موضوعًا");chk("m",v("m").length>=10,"الرسالة قصيرة (10 أحرف على الأقل)");
 const r=$("#r");if(er.length){r.className="err";r.textContent="يرجى تصحيح الحقول المشار إليها.";f[er[0]].focus();return}
 r.className="okmsg";r.textContent="تم استلام رسالتك بنجاح، شكرًا لتواصلك.";f.reset()}}
};
/* ===== محرك الاختبار ===== */
function start(id){const e=EXAMS.find(x=>x.id===id);const s={id,i:0,ans:Array(e.qs.length).fill(null),end:Date.now()+e.min*60000};ls.set("q",s);quiz(s)}
function quiz(s){
 const e=EXAMS.find(x=>x.id===s.id);clearInterval(timer);
 const draw=()=>{const q=e.qs[s.i],last=s.i===e.qs.length-1,left=Math.max(0,Math.ceil((s.end-Date.now())/1000));
  modal(`<div class="bar" style="justify-content:space-between"><b>${e.subject} — ${e.grade}</b><span id="tm" aria-live="off">⏱ ${num(Math.floor(left/60))}:${String(left%60).padStart(2,"0")}</span></div>
  <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${e.qs.length}" aria-valuenow="${s.i+1}"><i style="width:${(s.i+1)/e.qs.length*100}%"></i></div>
  <p>السؤال ${num(s.i+1)} من ${num(e.qs.length)}</p><h3>${q[0]}</h3>
  ${q[1].map((o,k)=>`<button class="opt ${s.ans[s.i]===k?"sel":""}" data-k="${k}">${o}</button>`).join("")}
  <div class="bar"><button class="btn alt" id="pv" ${s.i?"":"disabled"}>السابق</button>${last?`<button class="btn" id="fn2" ${s.ans.includes(null)?"disabled":""}>إنهاء</button>`:`<button class="btn" id="nx">التالي</button>`}</div>${s.ans.includes(null)&&last?`<small class="err">أجب عن جميع الأسئلة لتتمكن من الإنهاء.</small>`:""}`);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{s.ans[s.i]=+b.dataset.k;ls.set("q",s);draw()});
  const p=$("#pv"),n=$("#nx"),f=$("#fn2");if(p)p.onclick=()=>{s.i--;ls.set("q",s);draw()};if(n)n.onclick=()=>{s.i++;ls.set("q",s);draw()};if(f)f.onclick=finish;
  const c=$("#cl");c.onclick=()=>{clearInterval(timer);closeMod()}};
 const finish=()=>{clearInterval(timer);timer=null;ls.del("q");const ok=s.ans.filter((a,k)=>a===e.qs[k][2]).length,pct=Math.round(ok/e.qs.length*100);
  const h=ls.get("h",[]);h.unshift({title:`${e.subject} — ${e.grade}`,pct,date:Date.now()});ls.set("h",h.slice(0,30));
  modal(`<h2>النتيجة: ${num(pct)}٪</h2><p>✅ صحيحة: ${num(ok)} &nbsp; ❌ خاطئة: ${num(e.qs.length-ok)}</p>${e.qs.map((q,k)=>`<div class="card" style="margin:8px 0"><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<div class="opt ${j===q[2]?"ok":s.ans[k]===j?"bad":""}" style="margin:2px 0;padding:6px">${o}${j===q[2]?" ✔":""}</div>`).join("")}</div>`).join("")}<button class="btn" id="re">إعادة المحاولة</button>`);
  $("#re").onclick=()=>start(e.id);$("#cl").onclick=()=>{closeMod();if(location.hash==="#/nafes")route()}};
 draw();
 timer=setInterval(()=>{const left=Math.ceil((s.end-Date.now())/1000);if(left<=0){finish();return}const t=$("#tm");if(t)t.textContent=`⏱ ${num(Math.floor(left/60))}:${String(left%60).padStart(2,"0")}`},1000)}
/* ===== التوجيه ===== */
function route(){
 clearInterval(timer);closeMod();
 let k=location.hash.replace(/^#\/?/,"");if(!pages[k||"home"]&&k)k="";
 const key=k||"home";$("#app").innerHTML=pages[key]();
 document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));
 $("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
 document.title=(k?ROUTES.find(r=>r[0]===k)[1]+" | ":"")+SCHOOL.name;
 if(bind[key])bind[key]();window.scrollTo(0,0)}
$("#hn").textContent=SCHOOL.name;$("#fn").textContent=SCHOOL.name+" — "+SCHOOL.place;
$("#nav").innerHTML=ROUTES.map(r=>`<a href="#/${r[0]}" data-r="${r[0]}">${r[1]}</a>`).join("");
$("#fl").innerHTML=ROUTES.slice(1,5).map(r=>`<a href="#/${r[0]}">${r[1]}</a>`).join("");
$("#menu").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);route();
</script>
</body>
