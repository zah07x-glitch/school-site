<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزانية المقصف المدرسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#006C35;--g2:#E6F2EA;--gold:#B8963E;--bg:#F5F6F5;--sf:#fff;--tx:#1d2a22;--mu:#5c6b62;--bd:#d9dfdb;--red:#C62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#3fae72;--g2:#1c2b23;--gold:#d4b05a;--bg:#121714;--sf:#1a211d;--tx:#e8eee9;--mu:#9fb0a6;--bd:#2d3a32;--red:#ef7b7b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:auto;padding:12px}
header.top{background:var(--g);color:#fff;border-bottom:4px solid var(--gold);padding:14px;text-align:center}
header.top h1{margin:0;font-size:1.25rem}
header.top p{margin:2px 0 0;font-size:.85rem;opacity:.9}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
h2{margin:0 0 10px;font-size:1.05rem;color:var(--g);border-inline-start:4px solid var(--gold);padding-inline-start:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--sf);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:9px 16px;background:var(--g);color:#fff;font-weight:700}
button.sec{background:var(--g2);color:var(--g);border:1px solid var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{margin-top:8px;font-weight:500}.err{color:var(--red)}.ok{color:var(--g)}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.it{border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:8px;padding:10px}
.it b{display:block}.it .amt{font-size:1.15rem;font-weight:700}
.bar{height:10px;background:var(--g2);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c);width:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:center}
.donut{width:180px;height:180px;border-radius:50%;margin:auto;position:relative}
.donut:after{content:"";position:absolute;inset:36px;background:var(--sf);border-radius:50%}
.leg{font-size:.8rem;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;background:var(--c);margin-inline-end:4px;border-radius:2px}
.bc{display:flex;align-items:flex-end;gap:8px;height:180px;border-bottom:1px solid var(--bd)}
.bc div{flex:1;background:var(--c);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bl{display:flex;gap:8px;font-size:.7rem;text-align:center;color:var(--mu)}.bl span{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--g);color:#fff;cursor:pointer}
td.over{color:var(--red);font-weight:700}
tfoot td{font-weight:700;background:var(--g2)}
.pg{background:#fff;color:#1b2a3a;max-width:794px;margin:12px auto;padding:18px;border:1px solid #d9dfdb;border-radius:8px}
.pg h1{margin:4px 0 0;font-size:1.2rem}.pg h3{margin:14px 0 8px;color:#14365f;font-size:1rem;border-inline-start:5px solid #0f6b55;padding-inline-start:8px}
.rhd{background:#14365f;color:#fff;border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.85rem}
.lg{background:#fff;border-radius:10px;width:84px;min-height:64px;color:#14365f;font-size:.62rem;text-align:center;display:flex;align-items:center;justify-content:center;flex:none}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}.pl div{border:1px solid #dde3e8;border-radius:12px;padding:8px 12px;font-size:.85rem}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.k{border:1px solid #dde3e8;border-top:4px solid var(--c);border-radius:10px;text-align:center;padding:8px}.k b{display:block;font-size:1.05rem;color:var(--c)}.k span{font-size:.72rem;color:#5c6b62}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.cb{border:1px solid #dde3e8;border-radius:12px;padding:10px}.cb h4{margin:0 0 6px;font-size:.9rem;color:#14365f}
.pg th{background:#14365f}.pg td{color:#1b2a3a}.pg ul{margin:0;padding-inline-start:20px;font-size:.88rem}.pg .donut:after{background:#fff}.pg .leg{color:#1b2a3a}
.ft{border-top:3px solid #14365f;display:flex;justify-content:space-between;font-size:.78rem;font-weight:700;padding-top:6px;margin-top:14px}
.sg{border:1px solid #dde3e8;border-radius:12px;padding:10px;margin-top:14px;font-size:.85rem}.sg i{display:block;width:180px;border-top:2px solid #14365f;margin-top:26px}
.rh{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--g);padding-bottom:8px;margin-bottom:10px}
.logo{width:70px;height:70px;border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-size:.65rem;text-align:center;color:var(--gold)}
.sig{display:flex;justify-content:space-around;margin-top:40px}
@media print{@page{size:A4;margin:18mm 15mm}
body{background:#fff;color:#000}.wrap>*:not(#report){display:none!important}
#report{display:block!important}header.top{display:none}.pg{margin:0;border:0;border-radius:0;max-width:none;page-break-after:always}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="top"><h1>المملكة العربية السعودية — وزارة التعليم</h1><p>حاسبة الميزانية التشغيلية للمقصف المدرسي</p></header>
<main class="wrap">
<section class="card" aria-labelledby="h1"><h2 id="h1">بيانات الإدخال</h2>
<div class="grid">
<div><label for="total">إجمالي الميزانية التشغيلية (ر.س) *</label><input id="total" type="number" inputmode="decimal" min="0.01" step="0.01"></div>
<div><label for="school">اسم المدرسة</label><input id="school" value="مدرسة الإمام أبو حنيفة الابتدائية بالمهدج"></div>
<div><label for="term">الفصل الدراسي</label><input id="term"></div>
<div><label for="year">العام الدراسي</label><input id="year" placeholder="١٤٤٨هـ"></div>
<div><label for="by">اسم المعدّ</label><input id="by" value="عبدالله الزهراني"></div>
<div><label for="principal">مدير المدرسة</label><input id="principal" value="عثمان محمد مسملي"></div>
</div>
<div class="row"><button id="calc">احسب التوزيع</button><button id="reset" class="sec">إعادة تعيين</button></div>
<div id="msg" class="msg" role="status" aria-live="polite"></div></section>

<div id="out" hidden>
<section class="card"><h2>لوحة النتائج</h2><div id="items" class="items"></div></section>
<section class="card"><h2>الرسوم البيانية</h2><div class="charts">
<div><div id="donut" class="donut" role="img" aria-label="رسم دائري لتوزيع النسب"></div><div id="leg" class="leg"></div></div>
<div><div id="bars" class="bc" role="img" aria-label="رسم شريطي لمقارنة المبالغ"></div><div id="bl" class="bl"></div></div></div></section>
<section class="card"><h2>إدخال المصروفات الفعلية</h2>
<div class="grid">
<div><label for="eitem">البند</label><select id="eitem"></select></div>
<div><label for="eamt">المبلغ المصروف (ر.س)</label><input id="eamt" type="number" inputmode="decimal" min="0.01" step="0.01"></div>
<div><label for="edate">التاريخ</label><input id="edate" type="date"></div>
<div><label for="edesc">الوصف / الملاحظات</label><input id="edesc"></div></div>
<div class="row"><button id="add">إضافة مصروف</button></div>
<div id="emsg" class="msg" role="status" aria-live="polite"></div></section>
<section class="card"><h2>الجدول التفصيلي <small>(اضغط على العنوان للفرز)</small></h2><div class="tw"><table id="tbl"></table></div>
<div class="row"><button id="print">طباعة / حفظ PDF (A4)</button><button id="csv" class="sec">نسخ CSV</button></div>
<div id="cmsg" class="msg" role="status"></div></section>
<section class="card"><h2>إعداد التقرير الرسمي</h2><div class="grid">
<div><label for="rtype">نوع التقرير</label><select id="rtype"><option value="w">أسبوعي</option><option value="m">شهري</option><option value="t">فصلي</option></select></div>
<div><label for="rfrom">من تاريخ</label><input id="rfrom" type="date"></div>
<div><label for="rto">إلى تاريخ</label><input id="rto" type="date"></div></div>
<div class="msg">التقرير من ٣ صفحات A4 يظهر أدناه، واستخدم زر «طباعة / حفظ PDF» أعلاه.</div></section>
</div>
<section id="report" aria-label="التقرير الرسمي"></section>
</main>
<script>
(function(){
var ITEMS=[{k:'prog',n:'برامج وأنشطة',p:50,c:'#006C35'},{k:'sub',n:'إعانات الطلاب',p:15,c:'#B8963E'},{k:'off',n:'مستلزمات مكتبية',p:15,c:'#2E7D9A'},{k:'stu',n:'تكريم الطلاب',p:10,c:'#7B5EA7'},{k:'tea',n:'تكريم المعلمين',p:10,c:'#C2602D'}];
var $=function(i){return document.getElementById(i)};
var st={total:0,alloc:{},exp:[],meta:{},sort:null,rep:0};
var fmt=function(c){return (c/100).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س'};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function save(){try{localStorage.setItem('canteen',JSON.stringify({total:st.total,exp:st.exp,meta:st.meta,rep:st.rep}))}catch(e){}}
function msg(id,t,e){var m=$(id);m.textContent=t;m.className='msg '+(e?'err':'ok')}
function split(cents){
 var sum=ITEMS.reduce(function(a,i){return a+i.p},0);
 if(sum!==100){msg('msg','تحذير: مجموع النسب لا يساوي ١٠٠٪',1);return null}
 var a={},t=0;ITEMS.forEach(function(i){a[i.k]=Math.floor(cents*i.p/100);t+=a[i.k]});
 a[ITEMS[0].k]+=cents-t; return a}
function spent(k){return st.exp.filter(function(e){return e.k===k}).reduce(function(a,e){return a+e.c},0)}
function calc(){
 var v=$('total').value.trim();var n=Number(v);
 if(!v||!isFinite(n)||n<=0){msg('msg','أدخل مبلغاً رقمياً أكبر من صفر.',1);return}
 var cents=Math.round(n*100),a=split(cents);if(!a)return;
 var chk=ITEMS.reduce(function(s,i){return s+a[i.k]},0);
 if(chk!==cents){msg('msg','خطأ: مجموع المبالغ الموزعة لا يطابق الإجمالي.',1);return}
 st.total=cents;st.alloc=a;
 st.meta={school:$('school').value,term:$('term').value,year:$('year').value,by:$('by').value,principal:$('principal').value};
 if(!st.rep)st.rep=Date.now()%100000;
 msg('msg','تم التوزيع بنجاح: مجموع النسب ١٠٠٪ ومجموع المبالغ = الإجمالي (فرق التقريب ٠٫٠٠).');
 save();render()}
function render(){
 $('out').hidden=false;var h='',gr=[],pos=0,mx=0,l='',b='',bl='';
 ITEMS.forEach(function(i){mx=Math.max(mx,st.alloc[i.k])});
 ITEMS.forEach(function(i){
  h+='<div class="it" style="--c:'+i.c+'"><b>'+i.n+'</b><div class="amt">'+fmt(st.alloc[i.k])+'</div><div>'+i.p.toLocaleString('ar-SA')+'٪</div><div class="bar" role="progressbar" aria-valuenow="'+i.p+'" aria-valuemin="0" aria-valuemax="100" aria-label="'+i.n+'"><i style="width:'+i.p+'%"></i></div></div>';
  gr.push(i.c+' '+pos+'% '+(pos+i.p)+'%');pos+=i.p;
  l+='<span style="--c:'+i.c+'">'+i.n+'</span>';
  b+='<div style="--c:'+i.c+';height:'+Math.max(2,st.alloc[i.k]/mx*100)+'%" title="'+i.n+': '+fmt(st.alloc[i.k])+'"></div>';
  bl+='<span>'+i.n+'</span>'});
 $('items').innerHTML=h;$('donut').style.background='conic-gradient('+gr.join(',')+')';
 $('leg').innerHTML=l;$('bars').innerHTML=b;$('bl').innerHTML=bl;
 $('eitem').innerHTML=ITEMS.map(function(i){return '<option value="'+i.k+'">'+i.n+'</option>'}).join('');
 table();report()}
function rows(){return ITEMS.map(function(i){var s=spent(i.k),al=st.alloc[i.k];return{n:i.n,p:i.p,al:al,s:s,r:al-s,u:al?s/al*100:0}})}
function table(){
 var r=rows();if(st.sort){var k=st.sort.k,d=st.sort.d;r.sort(function(a,b){return (a[k]>b[k]?1:a[k]<b[k]?-1:0)*d})}
 var H=[['n','البند'],['p','النسبة'],['al','المخصص'],['s','المصروف'],['r','المتبقي'],['u','الاستهلاك']];
 var t='<thead><tr>'+H.map(function(x){return '<th data-k="'+x[0]+'" tabindex="0" scope="col">'+x[1]+'</th>'}).join('')+'</tr></thead><tbody>';
 r.forEach(function(x){t+='<tr><td>'+x.n+'</td><td>'+x.p+'٪</td><td>'+fmt(x.al)+'</td><td>'+fmt(x.s)+'</td><td class="'+(x.r<0?'over':'')+'">'+fmt(x.r)+(x.r<0?' ⚠ تجاوز':'')+'</td><td class="'+(x.r<0?'over':'')+'">'+x.u.toFixed(1)+'٪</td></tr>'});
 var S=r.reduce(function(a,x){return a+x.s},0);
 t+='</tbody><tfoot><tr><td>الإجمالي</td><td>١٠٠٪</td><td>'+fmt(st.total)+'</td><td>'+fmt(S)+'</td><td class="'+(st.total-S<0?'over':'')+'">'+fmt(st.total-S)+'</td><td>'+(S/st.total*100).toFixed(1)+'٪</td></tr></tfoot>';
 $('tbl').innerHTML=t;
 if(S>st.total)msg('emsg','تنبيه: مجموع المصروفات تجاوز الإجمالي.',1)}
function dates(){var d=new Date();
 return {g:d.toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'long',day:'numeric'}),h:d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'long',day:'numeric'})}}
var DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function D(s){return new Date(s+'T12:00:00')}
function hd(s){return D(s).toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'})}
function gd(s){return D(s).toLocaleDateString('ar-SA-u-ca-gregory',{year:'numeric',month:'numeric',day:'numeric'})}
function n0(c){return (c/100).toLocaleString('ar-SA',{maximumFractionDigits:0})}
function pc(x){return x.toLocaleString('ar-SA',{minimumFractionDigits:1,maximumFractionDigits:1})+'٪'}
function setRange(){var t=$('rtype').value,n=new Date(),a,b;
 if(t==='w'){a=new Date(n);a.setDate(n.getDate()-n.getDay());b=new Date(a);b.setDate(a.getDate()+6)}
 else if(t==='m'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
 else{var ds=st.exp.map(function(e){return e.d}).sort();a=ds.length?D(ds[0]):new Date(n.getFullYear(),n.getMonth(),1);b=n}
 $('rfrom').value=iso(a);$('rto').value=iso(b)}
function bars(labs,ser){
 var W=420,H=180,n=labs.length,k=ser.length,mx=1,gw=(W-20)/n,bw=Math.min(36,(gw-8)/k),o='<svg viewBox="0 0 420 200" width=100%>';
 ser.forEach(function(s){s.v.forEach(function(x){mx=Math.max(mx,x)})});
 labs.forEach(function(l,i){var g=n-1-i,x0=10+g*gw+(gw-bw*k)/2;
  ser.forEach(function(s,j){var h=s.v[i]/mx*(H-30),x=x0+(k-1-j)*bw;
   o+='<rect x='+x+' y='+(H-h)+' width='+(bw-3)+' height='+Math.max(h,1)+' rx=3 fill='+s.c+' /><text x='+(x+(bw-3)/2)+' y='+(H-h-3)+' font-size=9 text-anchor=middle fill=#1b2a3a>'+n0(s.v[i])+'</text>'});
  o+='<text x='+(10+g*gw+gw/2)+' y='+(H+14)+' font-size=9 text-anchor=middle fill=#5c6b62>'+l+'</text>'});
 return o+'<line x1=0 x2=420 y1='+H+' y2='+H+' stroke=#ccd3d8 /></svg>'}
function line(labs,v){
 var W=420,H=160,n=v.length,mx=Math.max.apply(null,v.concat([1])),pts=[],o='',sp=n>1?(W-60)/(n-1):0;
 v.forEach(function(y,i){var x=n>1?W-30-i*sp:W/2,yy=H-10-y/mx*(H-35);pts.push(x+','+yy);
  o+='<circle cx='+x+' cy='+yy+' r=3.5 fill=#0f6b55 /><text x='+x+' y='+(yy-8)+' font-size=9 text-anchor=middle fill=#1b2a3a>'+n0(y)+'</text><text x='+x+' y='+(H+12)+' font-size=9 text-anchor=middle fill=#5c6b62>'+labs[i]+'</text>'});
 return '<svg viewBox="0 0 420 180" width=100%><polyline fill=none stroke=#0f6b55 stroke-width=2 points="'+pts.join(' ')+'" /><line x1=0 x2=420 y1='+(H-10)+' y2='+(H-10)+' stroke=#ccd3d8 />'+o+'</svg>'}
function report(){
 if(!st.total)return;if(!$('rfrom').value)setRange();
 var m=st.meta,t=$('rtype').value,f=$('rfrom').value,to=$('rto').value,RP=$('report');
 if(!f||!to||f>to){RP.innerHTML='<p class="msg err">تحقق من تاريخي بداية ونهاية الفترة.</p>';return}
 var inP=st.exp.filter(function(e){return e.d>=f&&e.d<=to}),up=st.exp.filter(function(e){return e.d<=to}),
 T={w:'التقرير الأسبوعي',m:'التقرير الشهري',t:'التقرير الفصلي'}[t],
 sm=function(a,k){return a.filter(function(e){return e.k===k}).reduce(function(s,e){return s+e.c},0)},
 r=ITEMS.map(function(i){var p=sm(inP,i.k),c=sm(up,i.k),al=st.alloc[i.k];return{i:i,al:al,p:p,c:c,r:al-c,u:al?c/al*100:0}}),S=0,C=0;
 r.forEach(function(x){S+=x.p;C+=x.c});
 var a=D(f),days=Math.round((D(to)-a)/864e5)+1,keys=[],lab={},
 key=function(d){return days<=8?d:days<=62?'w'+Math.floor(Math.round((D(d)-a)/864e5)/7):d.slice(0,7)};
 for(var q=0;q<days;q++){var x=new Date(a);x.setDate(a.getDate()+q);var kk=key(iso(x));
  if(keys.indexOf(kk)<0){keys.push(kk);lab[kk]=days<=8?DN[x.getDay()]:days<=62?'أسبوع '+n0(keys.length*100):x.toLocaleDateString('ar-SA-u-ca-gregory',{month:'long'})}}
 var bv=keys.map(function(kk){return inP.filter(function(e){return key(e.d)===kk}).reduce(function(s,e){return s+e.c},0)}),
 bl=keys.map(function(kk){return lab[kk]}),cum=[],z=0;bv.forEach(function(v){z+=v;cum.push(z)});
 var best=r.slice().sort(function(x,y){return y.p-x.p})[0],mi=bv.indexOf(Math.max.apply(null,bv)),
 over=r.filter(function(x){return x.r<0}),gr=[],pos=0,
 ft=function(n){return '<div class=ft><span>إعداد: '+esc(m.by||'غير محدد')+'</span><span>الصفحة '+n0(n*100)+' من ٣</span><span>مدير المدرسة: '+esc(m.principal||'غير محدد')+'</span></div>'},
 kp=function(v,l,c){return '<div class=k style=--c:'+c+'><b>'+v+'</b><span>'+l+'</span></div>'},
 hdr='<div class=rhd><div><div>الإدارة العامة للتعليم بمنطقة جازان</div><div>المدارس المتكاملة بقطاع أبو عريش</div><b>'+T+' للميزانية التشغيلية للمقصف المدرسي في</b><h1>'+esc(m.school||'غير محدد')+'</h1></div><div class=lg>شعار وزارة التعليم<br>(يُستبدل بالشعار المعتمد)</div></div>';
 r.forEach(function(x){var w=S?x.p/S*100:0;gr.push(x.i.c+' '+pos+'% '+(pos+w)+'%');pos+=w});
 var p1='<div class=pg>'+hdr+'<div class=pl><div>الفترة من <b>'+hd(f)+'</b> إلى <b>'+hd(to)+'</b> هـ</div><div>الموافق '+gd(f)+' - '+gd(to)+'م</div><div>عدد الحركات: <b>'+n0(inP.length*100)+'</b></div><div>رقم التقرير: <b>'+st.rep+'</b> | الفصل: '+esc(m.term||'غير محدد')+' | العام: '+esc(m.year||'غير محدد')+'</div></div>'
 +'<h3>مؤشرات الميزانية</h3><div class=kp>'+kp(fmt(st.total),'الميزانية الإجمالية','#14365f')+kp(fmt(S),'المصروف خلال الفترة','#b4530f')+kp(fmt(st.total-C),'المتبقي حتى نهاية الفترة',st.total-C<0?'#C62828':'#0f6b55')+kp(pc(C/st.total*100),'نسبة الاستهلاك التراكمية','#b08a2e')+'</div>'
 +'<div class=cg style=margin-top:10px><div class=cb><h4>المخصص (أزرق) مقابل المصروف (برتقالي)</h4>'+bars(r.map(function(x){return x.i.n}),[{v:r.map(function(x){return x.al}),c:'#14365f'},{v:r.map(function(x){return x.c}),c:'#b4530f'}])+'</div>'
 +'<div class=cb><h4>توزيع مصروفات الفترة على البنود</h4><div class=donut style="width:150px;height:150px;background:conic-gradient('+(S?gr.join(','):'#e3e8e5 0% 100%')+')"></div><div class=leg>'+r.map(function(x){return '<span style=--c:'+x.i.c+'>'+x.i.n+'</span>'}).join('')+'</div></div></div>'
 +'<div class=cb style=margin-top:10px><h4>المصروف حسب '+(days<=8?'اليوم':days<=62?'الأسبوع':'الشهر')+'</h4>'+bars(bl,[{v:bv,c:'#0f6b55'}])+'</div>'+ft(1)+'</div>';
 var p2='<div class=pg>'+hdr+'<h3>المصروفات لكل بند</h3><div class=tw><table><tr><th>البند</th><th>المخصص</th><th>مصروف الفترة</th><th>المصروف التراكمي</th><th>المتبقي</th><th>الاستهلاك</th></tr>'
 +r.map(function(x){return '<tr><td>'+x.i.n+'</td><td>'+fmt(x.al)+'</td><td>'+fmt(x.p)+'</td><td>'+fmt(x.c)+'</td><td class='+(x.r<0?'over':'n')+'>'+fmt(x.r)+'</td><td>'+pc(x.u)+'</td></tr>'}).join('')
 +'</table></div><h3>حركات المصروفات في الفترة</h3><div class=tw><table><tr><th>التاريخ</th><th>البند</th><th>الوصف</th><th>المبلغ</th></tr>'
 +(inP.length?inP.slice().sort(function(x,y){return x.d<y.d?-1:1}).map(function(e){return '<tr><td>'+esc(e.d)+'</td><td>'+ITEMS.filter(function(i){return i.k===e.k})[0].n+'</td><td>'+esc(e.t||'-')+'</td><td>'+fmt(e.c)+'</td></tr>'}).join(''):'<tr><td colspan=4>لا توجد مصروفات مسجلة في هذه الفترة</td></tr>')
 +'</table></div>'+ft(2)+'</div>';
 var recs=[];
 if(!inP.length)recs.push('لا توجد مصروفات مسجلة خلال الفترة؛ يُرجى تسجيل الحركات أولاً.');
 if(over.length)recs.push('مراجعة البنود المتجاوزة للمخصص: '+over.map(function(x){return x.i.n}).join('، ')+'.');
 if(C/st.total>0.8)recs.push('تجاوز الاستهلاك ٨٠٪ من الميزانية؛ يُوصى بترشيد الصرف.');
 recs.push('توثيق المستندات والفواتير لكل حركة صرف.','المتابعة الدورية لحركة الصرف مقارنة بالمخصص.');
 var p3='<div class=pg>'+hdr+'<h3>مؤشرات تحليلية</h3><div class=kp>'+kp(S?best.i.n:'-','أعلى بند صرفاً','#14365f')+kp(S?bl[mi]:'-','أعلى فترة صرفاً','#b4530f')+kp(fmt(Math.round(S/days)),'متوسط الصرف اليومي','#b08a2e')+kp(n0(over.length*100),'بنود متجاوزة للمخصص',over.length?'#C62828':'#0f6b55')+'</div>'
 +'<div class=cb style=margin-top:10px><h4>اتجاه المصروف التراكمي خلال الفترة</h4>'+line(bl,cum)+'</div>'
 +'<h3>أبرز التوصيات</h3><div class=cb><ul>'+recs.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'
 +'<h3>خلاصة التقرير</h3><div class=cb style=font-size:.88rem>بلغت الميزانية التشغيلية للمقصف '+fmt(st.total)+'، وبلغ المصروف خلال الفترة من '+hd(f)+' إلى '+hd(to)+' هـ مبلغ '+fmt(S)+' عبر '+n0(inP.length*100)+' حركة، ليصل المصروف التراكمي إلى '+fmt(C)+' ('+pc(C/st.total*100)+') ويبقى '+fmt(st.total-C)+'.'+(S?' وكان أعلى البنود صرفاً: '+best.i.n+'.':'')+'</div>'
 +'<div class=sg>مدير المدرسة<br><b>'+esc(m.principal||'غير محدد')+'</b><i></i>التوقيع</div>'+ft(3)+'</div>';
 RP.innerHTML=p1+p2+p3}
function addExp(){
 var n=Number($('eamt').value);
 if(!st.total){msg('emsg','احسب التوزيع أولاً.',1);return}
 if(!isFinite(n)||n<=0){msg('emsg','أدخل مبلغاً صحيحاً أكبر من صفر.',1);return}
 st.exp.push({k:$('eitem').value,c:Math.round(n*100),t:$('edesc').value,d:$('edate').value||new Date().toISOString().slice(0,10)});
 $('eamt').value='';$('edesc').value='';msg('emsg','تمت إضافة المصروف.');save();table();report()}
function csv(){
 var o='\ufeffالبند,النسبة,المخصص,المصروف,المتبقي\n';
 rows().forEach(function(x){o+=[x.n,x.p+'%',(x.al/100).toFixed(2),(x.s/100).toFixed(2),(x.r/100).toFixed(2)].join(',')+'\n'});
 o+='\nالتاريخ,البند,الوصف,المبلغ\n';
 st.exp.forEach(function(e){o+=[e.d,e.k,'"'+e.t.replace(/"/g,'""')+'"',(e.c/100).toFixed(2)].join(',')+'\n'});
 try{navigator.clipboard.writeText(o).then(function(){msg('cmsg','تم نسخ بيانات CSV؛ الصقها في Excel.')},function(){msg('cmsg','تعذر النسخ.',1)})}catch(e){msg('cmsg','تعذر النسخ.',1)}}
$('calc').onclick=calc;$('add').onclick=addExp;$('csv').onclick=csv;
$('rtype').onchange=function(){setRange();report()};$('rfrom').onchange=$('rto').onchange=report;
$('print').onclick=function(){report();window.print()};
$('reset').onclick=function(){st={total:0,alloc:{},exp:[],meta:{},sort:null,rep:0};try{localStorage.removeItem('canteen')}catch(e){}
 ['total','school','term','year','by'].forEach(function(i){$(i).value=''});$('out').hidden=true;msg('msg','تمت إعادة التعيين.')};
$('tbl').addEventListener('click',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-k');if(!k)return;
 st.sort={k:k,d:st.sort&&st.sort.k===k?-st.sort.d:1};table()});
$('tbl').addEventListener('keydown',function(e){if(e.key==='Enter')e.target.click()});
try{var s=JSON.parse(localStorage.getItem('canteen')||'null');
 if(s&&s.total){st.exp=s.exp||[];st.meta=s.meta||{};st.rep=s.rep||0;
  $('total').value=s.total/100;$('school').value=st.meta.school||'';$('term').value=st.meta.term||'';$('year').value=st.meta.year||'';$('by').value=st.meta.by||'';calc()}}catch(e){}
})();
</script>
